services:
  db:
    image: postgres:16-alpine
    container_name: pokemon-scanner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pokemon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokemon}
      POSTGRES_DB: ${POSTGRES_DB:-pokemon_cards}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pokemon-scanner-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── deploy (perfil) ───────────────────────────────────────────────────────
  # `docker compose up` normal NO levanta estos dos: siguen usando el backend
  # en `pnpm backend:dev` y el frontend en `pnpm frontend:dev`.
  # Para correr todo en contenedores: `docker compose --profile deploy up -d`
  backend:
    profiles: ["deploy"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pokemon-scanner-backend:latest
    container_name: pokemon-scanner-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-pokemon}:${POSTGRES_PASSWORD:-pokemon}@db:5432/${POSTGRES_DB:-pokemon_cards}
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL:?Configurá el origen HTTPS del frontend}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      JWT_SECRET: ${JWT_SECRET:?Configurá JWT_SECRET antes de desplegar}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Configurá JWT_REFRESH_SECRET antes de desplegar}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
    ports:
      - "3001:3001"

  frontend:
    profiles: ["deploy"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # El browser llama a la API desde el host, no desde la red de Docker.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    image: pokemon-scanner-frontend:latest
    container_name: pokemon-scanner-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
