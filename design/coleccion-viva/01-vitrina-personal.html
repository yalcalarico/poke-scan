.showcase-hero{min-width:0;display:flex;flex-direction:column;gap:12px}.showcase-caption{text-align:center;font-size:12px;line-height:16px;color:var(--text-secondary)}.showcase-empty{max-width:320px;padding:24px;border:1px dashed var(--border-control);border-radius:var(--radius-panel);background:var(--surface-2);text-align:center;display:flex;flex-direction:column;gap:16px}.shelf .showcase-card{position:absolute;width:172px;aspect-ratio:63/88;border:0;padding:0;background:none;transform:translateX(-108px) rotate(-12deg)}.shelf .showcase-card:nth-child(2){transform:translateX(108px) rotate(12deg)}.shelf .showcase-card:nth-child(3){transform:translateY(-12px);z-index:1}.shelf .showcase-card .card-art{position:relative;width:100%;height:100%;transform:none}.shelf[data-count="1"] .showcase-card{transform:none}.shelf[data-count="2"] .showcase-card:first-child{transform:translateX(-64px) rotate(-8deg)}.shelf[data-count="2"] .showcase-card:nth-child(2){transform:translateX(64px) rotate(8deg)}.showcase-choice{position:relative;display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--border-control);border-radius:var(--radius-surface);background:var(--surface);cursor:pointer;min-width:0}.showcase-choice:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}.showcase-choice .card-art{width:100%;box-shadow:var(--shadow-xs)}.showcase-choice input{width:24px;height:24px;min-height:24px;accent-color:var(--brand)}.showcase-choice .check-row{justify-content:space-between}.showcase-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:1100px){.shelf .showcase-card{width:140px;transform:translateX(-80px) rotate(-12deg)}.shelf .showcase-card:nth-child(2){transform:translateX(80px) rotate(12deg)}}
@media(max-width:700px){.showcase-hero{order:-1}.shelf .showcase-card{width:132px;transform:translateX(-72px) rotate(-12deg)}.shelf .showcase-card:nth-child(2){transform:translateX(72px) rotate(12deg)}.showcase-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.showcase-choice{padding:12px}.showcase-empty{padding:20px}}

.goal-management{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}.goal-item{display:flex;flex-direction:column;gap:16px}.goal-suggestion{border-color:var(--brand-border)}.goal-actions{display:flex;gap:8px;flex-wrap:wrap}.goal-selector{max-width:480px}.goal-item .badge{align-self:start}.goal-summary{background:var(--surface-2);border-radius:var(--radius-control);padding:12px 16px;color:var(--text-secondary);font-size:12px;line-height:16px}
@media(max-width:1023px){.goal-management{grid-template-columns:1fr}.goal-management>aside{order:-1}}
@media(max-width:700px){.goal-actions button{flex:1}.goal-selector{max-width:none}}

<body><a class="skip" href="#content">Saltar al contenido</a>
<div class="prototype"><span><b>PROTOTIPO 01 / Vitrina personal</b><span class="long-note"> · Sin conexión a tu cuenta</span></span><button class="mobile-theme" data-action="theme" data-theme-label>Tema oscuro</button><small class="desktop-only">Probá el recorrido · Mobile + desktop</small></div>
<header class="topbar"><div class="topbar-inner"><a class="wordmark" href="#content" aria-label="PokéScan, saltar al contenido"><span class="mark" aria-hidden="true">P</span>PokéScan</a><nav class="nav" aria-label="Navegación del prototipo"><button data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M3 10 12 3l9 7v11h-6v-7H9v7H3z"/></svg><span class="nav-label">Inicio</span></button><button data-nav="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M20 20l-5-5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0"/></svg><span class="nav-label">Buscar</span></button><button data-nav="scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M3 8V3h5m8 0h5v5m0 8v5h-5M8 21H3v-5M7 12h10"/></svg><span class="nav-label">Escanear</span></button><button data-nav="collection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M5 3h14v18H5zM9 3v18M5 9h14M5 15h14"/></svg><span class="nav-label">Colecciones</span></button><button data-nav="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8M12 2v3m0 14v3M2 12h3m14 0h3"/></svg><span class="nav-label">Ajustes</span></button></nav><button class="theme-tool" data-action="theme" data-theme-label>Tema oscuro</button></div></header>
<main id="content" class="app" tabindex="-1"></main><div id="notice" class="status" role="status" aria-live="polite"></div>
<script>
const direction = "vitrina";
const definitions = {
  vitrina: {number:'01',title:'Vitrina personal',subtitle:'La emoción de coleccionar, primero.',tradeoff:'Cartas grandes y selección editorial. Menos densidad para administrar muchas copias.'},
  atlas: {number:'02',title:'Atlas de colección',subtitle:'Cada carta tiene su lugar.',tradeoff:'Objetivos, faltantes y gestión en primer plano. Más estructura; menos impacto de vitrina.'},
  mesa: {number:'03',title:'Mesa de intercambio',subtitle:'Tu colección abre conversaciones.',tradeoff:'Ofrecer y buscar se leen juntos. Requiere decidir qué mostrar; no propone una red social.'}
};
const config=definitions[direction];
const samples=[
 {name:'Pikachu',kind:'Rayo',tone:'soft',shape:'bolt'},
 {name:'Gengar',kind:'Sombra',tone:'ink',shape:'moon'},
 {name:'Charizard',kind:'Fuego',tone:'mist',shape:'flame'},
 {name:'Bulbasaur',kind:'Bosque',tone:'soft',shape:'leaf'},
 {name:'Eevee',kind:'Encuentro',tone:'mist',shape:'star'},
 {name:'Mew',kind:'Origen',tone:'ink',shape:'orbit'}
];
const paths={bolt:'M110 24 58 105h40l-12 72 62-97h-44z',moon:'M135 38c-64 12-77 98-13 127-86 18-113-110-33-138 12-4 30-3 46 11z',flame:'M99 22c8 45 58 60 50 110-7 51-81 61-96 9-10-32 10-58 27-77-1 26 12 32 18 37 12-30 0-52 1-79z',leaf:'M154 32C83 30 39 77 54 122s87 39 98-16c5-27-4-46 2-74zM65 147l71-95M82 116l-5-32M104 94l30 3',star:'M100 22l21 55 58 2-46 38 15 58-48-34-49 34 16-58-46-38 58-2z',orbit:'M100 43c75 0 75 114 0 114s-75-114 0-114zM30 140C-4 97 167 18 181 67c12 46-119 116-151 73z'};
const icons={home:'M3 10 12 3l9 7v11h-6v-7H9v7H3z',search:'M20 20l-5-5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0',scan:'M3 8V3h5m8 0h5v5m0 8v5h-5M8 21H3v-5M7 12h10',collection:'M5 3h14v18H5zM9 3v18M5 9h14M5 15h14',settings:'M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2',swap:'M3 7h17l-4-4M21 17H4l4 4',target:'M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8',plus:'M12 5v14M5 12h14'};
let view='home',current=0,session=null,saved=[],offered=[1],wanted=[4],filter='all',search='',stage='idle',theme=false;
let lastDialogFocus;
function escapeMarkup(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function initialCollections(){return [{id:'pikachus',name:'Sólo Pikachus',kind:'Por Pokémon',items:[0]},{id:'base-set',name:'Mi Base Set',kind:'Por expansión',items:[0,2,3]},{id:'favoritas',name:'Mis favoritas',kind:'Personalizada',items:[1,4,5]}];}
let demoCollections=initialCollections(),activeCollectionId='pikachus',nextCollectionId=1;
let demoGoals=[],nextGoalId=1,editingGoalId=null,goalDraftTitle='';
const suggestionPositions=new Map();
function collectionGoals(){return demoGoals.filter(g=>g.collectionId===activeCollectionId)}
function suggestedGoal(){
 const kind=activeCollection().kind;
 const options=kind==='Por Pokémon'?['Reunir versiones de mi Pokémon favorito','Descubrirlo en otra expansión','Elegir mis ilustraciones favoritas']:kind==='Por expansión'?['Elegir mi próxima carta del set','Armar una página temática del set','Revisar qué cartas quiero buscar']:['Elegir un ilustrador para descubrir','Armar una selección para compartir','Buscar una carta para mi vitrina'];
 return options[(suggestionPositions.get(activeCollectionId)||0)%options.length];
}
function goalsCollectionSelector(){return `<label class="form-field goal-selector" for="goal-collection">Objetivos de la colección<select id="goal-collection">${collectionOptions()}</select></label>`}
function goalEditor(){const goal=demoGoals.find(g=>g.id===editingGoalId);const text=goal?goal.title:goalDraftTitle;return `<div class="stack-lg form-page">${title('Objetivo de colección',goal?'Editar objetivo.':'Un nuevo objetivo.','Para '+escapeMarkup(activeCollection().name)+'. Sólo se guarda en memoria de esta maqueta.',btn('Cancelar','goals'))}<section class="panel"><form id="goal-form"><label class="form-field" for="goal-title">Qué querés conseguir<input id="goal-title" name="title" value="${escapeMarkup(text)}" maxlength="120" required placeholder="Ej.: Reunir Pikachus de distintos sets" aria-describedby="goal-title-hint goal-error"></label><p id="goal-title-hint" class="caption">Nombre libre, de 1 a 120 caracteres. Podés adaptar cualquier sugerencia antes de guardarla.</p><p id="goal-error" class="form-error" role="alert"></p><button class="primary" type="submit">Guardar objetivo</button><p class="caption">No se calcula progreso ni se marca como cumplido sin evidencia. Al recargar, los objetivos de muestra se pierden.</p></form></section></div>`}
let demoProfile={name:''},demoPrivacy={showValues:false};
function activeCollection(){return demoCollections.find(c=>c.id===activeCollectionId)||demoCollections[0]}
function collectionOptions(){return demoCollections.map(c=>`<option value="${c.id}" ${c.id===activeCollectionId?'selected':''}>${escapeMarkup(c.name)}</option>`).join('')}
function collectionDestination(id){return `<label class="form-field" for="${id}">Colección de destino<select id="${id}">${collectionOptions()}</select></label>`}
function saveToCollection(id){const target=activeCollection();if(!target.items.includes(id))target.items.push(id);if(!saved.includes(id))saved.push(id);}
// Sólo preferencias de esta maqueta: nunca inventario, fotos ni datos de cuenta.
const showcaseStorageKey='pokescan.design.coleccion-viva.01.showcase.v1';
let showcaseStorageAvailable=true;
function ownedSampleIds(){return [...new Set(demoCollections.flatMap(c=>c.items))].filter(i=>Number.isInteger(i)&&i>=0&&i<samples.length)}
function defaultShowcase(){return {mode:'personal',pool:ownedSampleIds(),cursor:0}}
function readShowcase(){
 try{
  const raw=sessionStorage.getItem(showcaseStorageKey);if(!raw)return defaultShowcase();
  const value=JSON.parse(raw);
  if(!value||!['personal','value'].includes(value.mode)||!Array.isArray(value.pool)||value.pool.length>samples.length||!value.pool.every(i=>Number.isInteger(i)&&ownedSampleIds().includes(i))||new Set(value.pool).size!==value.pool.length||!Number.isSafeInteger(value.cursor)||value.cursor<0)return defaultShowcase();
  return {mode:value.mode,pool:value.pool,cursor:value.cursor%Math.max(value.pool.length,1)};
 }catch{showcaseStorageAvailable=false;return defaultShowcase()}
}
let showcase=readShowcase();
function persistShowcase(nextCursor=showcase.cursor){
 try{sessionStorage.setItem(showcaseStorageKey,JSON.stringify({mode:showcase.mode,pool:showcase.pool,cursor:nextCursor}));showcaseStorageAvailable=true;}catch{showcaseStorageAvailable=false;}
}
// El avance se guarda para la próxima carga, no para cada render o navegación.
persistShowcase((showcase.cursor+1)%Math.max(showcase.pool.length,1));
function showcaseIds(){
 if(showcase.mode==='value')return []; // Sin referencias reales, no existe un ranking demostrable.
 const pool=showcase.pool.filter(i=>ownedSampleIds().includes(i));
 return Array.from({length:Math.min(3,pool.length)},(_,n)=>pool[(showcase.cursor+n)%pool.length]);
}
function showcaseCaption(){return showcase.mode==='value'?'Tus tres más valiosas · Referencias de mercado pendientes':'Selección personal demo · Hasta tres cartas por visita'}
function showcaseHero(){const ids=showcaseIds();return `<div class="showcase-hero"><div class="shelf" data-count="${ids.length}" aria-label="Cartas destacadas de tus colecciones">${ids.length?ids.map(i=>`<button class="showcase-card" data-detail="${i}" aria-label="Ver ${samples[i].name}, destacada de tu vitrina">${art(i)}</button>`).join(''):`<div class="showcase-empty"><h2>${showcase.mode==='value'?'Sin ranking disponible':'Tu vitrina está vacía'}</h2><p class="caption">${showcase.mode==='value'?'No hay cotizaciones conectadas. No elegimos tres cartas al azar como si fueran las más valiosas.':'Elegí cartas de tus colecciones para destacarlas acá.'}</p>${btn('Personalizar vitrina','showcase')}</div>`}</div><p class="showcase-caption">${showcaseCaption()}</p><p class="showcase-caption">${showcaseStorageAvailable?'Preferencias sólo en esta pestaña. Recargá para rotar la selección personal.':'El navegador no permite conservar preferencias. La selección puede volver a la muestra inicial al recargar.'}</p></div>`}
function showcaseView(){return `<div class="stack-lg">${title('Vitrina de inicio','Una vitrina bien tuya.','Destacá cartas de cualquiera de tus colecciones, sin duplicarlas por estar en varios álbumes.',btn('Aplicar vitrina','apply-showcase',true))}<section class="panel stack"><h2>Qué querés mostrar</h2><div class="filter-row" aria-label="Modo de vitrina"><button data-showcase-mode="value" aria-pressed="${showcase.mode==='value'}">Mis más valiosas</button><button data-showcase-mode="personal" aria-pressed="${showcase.mode==='personal'}">Mi selección</button></div><p class="muted">${showcase.mode==='value'?'Las tres cartas con mayor referencia de precio unitario entre tus colecciones. Sin sumar copias ni repetir una carta en varios álbumes. En esta maqueta no hay precios: se muestra un estado sin ranking.':'Elegí las cartas que querés mostrar. Hasta tres aparecen juntas; si elegís más, van rotando al recargar. Con una o dos se muestran sólo las elegidas.'}</p><p class="caption">${showcase.mode==='value'?'El ranking no rota al azar: conserva las más valiosas mientras no cambien las referencias.':'La selección inicial es editorial. Tus preferencias se conservan sólo durante esta pestaña; no se guardan en tu cuenta.'}</p></section>${showcase.mode==='personal'?`<section class="stack" aria-label="Elegir cartas destacadas"><h2>De todas tus colecciones</h2><div class="showcase-grid">${ownedSampleIds().map(i=>`<label class="showcase-choice" for="showcase-card-${i}">${art(i)}<span class="check-row"><b>${samples[i].name}</b><input id="showcase-card-${i}" type="checkbox" data-showcase-card="${i}" ${showcase.pool.includes(i)?'checked':''}></span><span class="caption">Ilustración de tus álbumes de muestra</span></label>`).join('')}</div></section>`:''}<p class="value-note">Sólo guardamos modo, identificadores de muestras y posición de rotación en sessionStorage. No guardamos fotos, inventario, datos personales ni cotizaciones. “Reiniciar muestra” restablece también esta preferencia.</p></div>`}
const searchState={query:'',set:'all',collection:'all',sort:'name',direction:'asc'};
// Agrupaciones editoriales: ilustran filtros, no certifican una edición física.
const sampleSets=['Base Set','Fossil','Base Set','Base Set','Jungle','Wizards Black Star Promos'];
const searchCollator=new Intl.Collator('es',{sensitivity:'base'});
function searchIds(){
 const query=searchState.query.trim().toLocaleLowerCase('es');
 const ids=samples.flatMap((card,i)=>{
  const matchesName=card.name.toLocaleLowerCase('es').includes(query);
  const matchesSet=searchState.set==='all'||sampleSets[i]===searchState.set;
  const selectedCollection=demoCollections.find(c=>c.id===searchState.collection);
  const matchesCollection=selectedCollection?selectedCollection.items.includes(i):searchState.collection!=='saved'||saved.includes(i);
  return matchesName&&matchesSet&&matchesCollection?[i]:[];
 });
 const sign=searchState.direction==='desc'?-1:1;
 return ids.sort((a,b)=>{
  // No se simulan cotizaciones: todas las muestras carecen de precio.
  if(searchState.sort==='price')return searchCollator.compare(samples[a].name,samples[b].name);
  const left=searchState.sort==='set'?sampleSets[a]:samples[a].name;
  const right=searchState.sort==='set'?sampleSets[b]:samples[b].name;
  return sign*searchCollator.compare(left,right)||searchCollator.compare(samples[a].name,samples[b].name);
 });
}
function searchResults(){const ids=searchIds();return ids.length?ids.map(i=>tile(i)+`<p class="caption">${sampleSets[i]} · Agrupación demo</p>`).map(markup=>`<div class="stack">${markup}</div>`).join(''):`<section class="panel stack"><h2>Sin coincidencias</h2><p class="muted">No hay muestras que coincidan con la búsqueda y los filtros. Probá limpiar la selección.</p></section>`}
function updateSearchResults(){
 const results=document.getElementById('search-results');if(!results)return;
 results.innerHTML=searchResults();const count=searchIds().length;
 document.getElementById('search-summary').textContent=count===1?'1 carta de muestra':`${count} cartas de muestra`;
 document.getElementById('search-price-note').hidden=searchState.sort!=='price';
}
function resetSearch(){Object.assign(searchState,{query:'',set:'all',collection:'all',sort:'name',direction:'asc'});render();document.getElementById('search-input').focus();announce('Búsqueda y filtros limpiados.');}
function icon(name){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${icons[name]||icons.plus}"/></svg>`}
function art(i){const c=samples[i];return `<div class="card-art ${c.tone}" aria-hidden="true"><span class="card-name">${c.name}</span><svg viewBox="0 0 200 200" fill="none"><circle cx="100" cy="100" r="84" stroke="currentColor" stroke-width="1"/><circle cx="100" cy="100" r="68" stroke="currentColor" stroke-width="1" stroke-dasharray="2 8"/><path d="${paths[c.shape]}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="card-foot"><span>${c.kind}<br><span class="edition">Estudio visual</span></span><span>✧</span></span></div>`}
function tile(i){const c=samples[i];return `<button class="tile" data-detail="${i}" aria-label="Ver detalle de ${c.name}">${art(i)}<h3>${c.name}</h3><span class="caption">Ilustración editorial · Sin cotización</span></button>`}
function btn(text,action,primary=false){return `<button ${primary?'class="primary"':''} data-action="${action}">${text}</button>`}
function title(label,heading,description,actions=''){return `<header class="section-head"><div class="stack"><span class="eyebrow">${label}</span><h1 id="page-title" tabindex="-1">${heading}</h1><p class="muted">${description}</p></div>${actions?`<div class="row">${actions}</div>`:''}</header>`}
function note(){return `<footer class="page-note"><p><b>Prototipo ${config.number} · ${config.title}.</b> ${config.tradeoff}</p><p>Selección editorial, no inventario real. Dibujos abstractos, no imágenes de cartas. Sin conexión a tu cuenta, sin precios inventados ni inventario persistido. Sólo las preferencias de vitrina se conservan en esta pestaña. Deseadas, objetivos y modo encuentro son propuestas.</p></footer>`}
function valuePanel(){return `<section class="panel stack" aria-label="Valor de referencia"><div class="between"><span class="eyebrow">Valor de referencia</span><span class="badge">USD</span></div><p class="metric-value" aria-label="Sin referencia de valor">—</p><p class="muted">Sin cotizaciones conectadas en esta maqueta.</p><div class="value-note">TCGplayer vía TCGCSV en el producto. Una conversión a ARS no equivale a un precio de venta local.</div><details><summary>Cómo se calcula</summary><p class="caption">Sólo se suman copias con precio para su variante. Un total parcial debe indicar cobertura; la condición registrada no ajusta esa referencia.</p></details></section>`}
function history(){return `<section class="panel stack"><div class="between"><h2>Evolución del valor</h2><span class="badge">Sin serie</span></div><div class="empty-chart"><div class="stack"><b>Una historia con datos reales.</b><p class="caption">Acá aparecerán observaciones disponibles. No dibujamos una tendencia sin historial.</p></div></div><p class="caption">El valor de la colección también cambia al sumar o retirar cartas. No representa rentabilidad.</p></section>`}
function goalPanel(){const next=collectionGoals()[0];return `<section class="panel stack"><div class="between"><h2>Tu próximo objetivo</h2><span class="badge proposal">Demo</span></div><p class="caption">En ${escapeMarkup(activeCollection().name)}</p><div class="goal"><span class="goal-mark">${icon('target')}</span><div><h3>${escapeMarkup(next?next.title:suggestedGoal())}</h3><p class="caption">${next?'Objetivo elegido por vos.':'Sugerencia editorial; todavía no es un objetivo.'}</p></div></div><div class="goal-actions">${next?`<button data-edit-goal="${next.id}">Editar objetivo</button>`:btn('Usar sugerencia','use-goal-suggestion')}${next?'':btn('Generar otra','next-goal-suggestion')}${btn('Ver objetivos','goals')}</div><p class="caption">Podés crear y modificar objetivos desde cada colección. Sin progreso inventado.</p></section>`}
function home(){
 if(direction==='atlas')return `<div class="atlas"><aside class="atlas-menu panel stack"><span class="eyebrow">Tu atlas personal</span><h2>Coleccionar con rumbo.</h2><div class="menu-buttons">${btn('Vista general','home')}${btn('Mi colección','collection')}${btn('Objetivos','goals')}${btn('Intercambios','trade')}</div><div class="separator"></div><p class="caption">La colección de muestra no está conectada a tu inventario.</p></aside><div class="stack-lg">${title('02 / Orden y descubrimiento','Cada carta cuenta.','Mirar lo que tenés. Encontrar lo que falta. Elegir qué sigue.',btn('Escanear carta','scan',true))}<div class="workspace"><section class="stack"><div class="between"><h2>Tu archivo visual</h2>${btn('Abrir colección','collection')}</div><div class="album"><div class="cards">${[0,1,2,3].map(tile).join('')}<button class="missing" data-action="goals">${icon('plus')}<b>Tu próximo hallazgo</b><span class="caption">Definí una deseada</span></button><button class="missing" data-action="scan">${icon('scan')}<b>Sumar una carta</b><span class="caption">Probá el recorrido</span></button></div></div></section><aside class="stack">${goalPanel()}${valuePanel()}</aside></div>${history()}</div></div>`;
 if(direction==='mesa')return `<div class="stack-lg">${title('03 / Coleccionar y conectar','Encontrá el próximo cambio.','Una mesa para mostrar lo que ofrecés, sin exponer toda tu colección.',btn('Escanear carta','scan',true))}<section class="trade-hero"><div class="stack"><span class="badge proposal">Modo encuentro · Propuesta</span><h2 class="large">Lo que te sobra.<br>Lo que te falta.</h2><p class="muted">Prepará una selección antes de compartir. Vos elegís qué cartas y qué datos mostrar.</p><div class="row">${btn('Preparar mesa','trade')}${btn('Vista compartida','share')}</div></div><div class="process"><div><b>Elegí</b><span class="caption">Lo disponible</span></div><div><b>Mostrá</b><span class="caption">Lo que buscás</span></div><div><b>Revisá</b><span class="caption">Cada propuesta</span></div></div></section><div class="trade-pair"><section class="trade-side stack"><div class="between"><h2>Para ofrecer</h2><span class="badge">Selección demo</span></div><div class="cards">${[1,2].map(tile).join('')}</div>${btn('Editar selección','trade')}</section><section class="trade-side stack"><div class="between"><h2>Para descubrir</h2><span class="badge proposal">Deseadas</span></div><div class="cards">${[4,5].map(tile).join('')}</div>${btn('Ver deseadas','goals')}</section></div><div class="three">${goalPanel()}${valuePanel()}<section class="panel stack"><h2>Tu colección, privada</h2><p class="muted">Compartir no tiene por qué mostrar cuánto vale todo lo que tenés.</p>${btn('Revisar privacidad','share')}</section></div></div>`;
 return `<div class="stack-lg"><section class="hero"><div class="stack-lg"><div class="stack"><span class="eyebrow">01 / Tu colección viva</span><h1 id="page-title" tabindex="-1">Tus cartas<br>cuentan historias.</h1><p class="muted">Guardalas en un lugar propio. Descubrí su valor y elegí cuál va a ser tu próximo hallazgo.</p></div><div class="row">${btn('Escanear carta','scan',true)}${btn('Ver colecciones','collection')}${btn('Personalizar vitrina','showcase')}</div><p class="caption">Colecciones de muestra · Sin datos de tu cuenta</p></div>${showcaseHero()}</section><div class="two"><div class="stack-lg"><section class="stack"><div class="between section-label"><div><span class="eyebrow">Tu vitrina</span><h2>Cartas que cuentan algo.</h2></div>${btn('Ver todas','collection')}</div><div class="cards">${[0,1,3,4].map(tile).join('')}</div></section><section class="panel between"><div class="stack"><span class="badge proposal">Compartir con intención</span><h2>Una vitrina para mostrar.</h2><p class="muted">Elegí qué mostrar. Tu inventario completo queda afuera.</p></div>${btn('Vista compartida','share')}</section></div><aside class="stack-lg">${valuePanel()}${goalPanel()}</aside></div></div>`;
}
function collectionOverview(){return `<div class="stack-lg">${title('Tus colecciones','Coleccioná a tu manera.','Por Pokémon, por expansión o con el criterio que quieras. Cada colección tiene su propio nombre.',btn('Crear colección','create-collection',true))}<p class="value-note">Álbumes de muestra, no tu inventario real. Un set es una expansión oficial; una colección es un álbum que vos armás, incluso mezclando sets.</p><section class="collection-grid" aria-label="Colecciones de muestra">${demoCollections.map(c=>`<article class="panel collection-card"><div class="collection-cover" aria-hidden="true">${c.items.length?c.items.slice(0,2).map(i=>`<div>${art(i)}</div>`).join(''):'<span class="muted">Tu próximo álbum</span>'}</div><div class="stack"><span class="eyebrow">${escapeMarkup(c.kind)}</span><h2>${escapeMarkup(c.name)}</h2><p class="caption">${c.items.length===1?'1 ilustración de muestra':c.items.length+' ilustraciones de muestra'} · Valor sin cotización</p></div><button data-open-collection="${c.id}">Abrir colección</button><button data-goals-collection="${c.id}">Ver objetivos</button></article>`).join('')}</section></div>`}
function createCollectionView(){return `<div class="stack-lg form-page">${title('Nuevo álbum de muestra','Tu colección, tus reglas.','Elegí un nombre libre. El criterio no limita qué cartas podés sumar.',btn('Cancelar','collection'))}<section class="panel"><form id="create-collection-form"><label class="form-field" for="collection-name">Nombre de la colección<input id="collection-name" name="name" maxlength="80" required placeholder="Ej.: Pikachus de todas las expansiones" aria-describedby="collection-name-hint collection-form-error"></label><p id="collection-name-hint" class="form-hint">Hasta 80 caracteres. Podés usar el nombre que quieras.</p><label class="form-field" for="collection-kind">Cómo querés organizarla<select id="collection-kind" name="kind"><option>Personalizada</option><option>Por Pokémon</option><option>Por expansión</option></select></label><p class="caption">Es una etiqueta de organización, no un filtro automático. La colección empieza vacía y privada en esta maqueta.</p><p id="collection-form-error" class="form-error" role="alert"></p><button type="submit" class="primary">Crear colección</button><p class="caption">Sólo memoria de esta página. Al recargar se pierde.</p></form></section></div>`}
function collectionDetail(){let ids=filter==='offers'?activeCollection().items.filter(i=>offered.includes(i)):filter==='saved'?activeCollection().items.filter(i=>saved.includes(i)):activeCollection().items;return `<div class="stack-lg">${title('Colección de muestra',escapeMarkup(activeCollection().name),'Una colección con su propio nombre, cartas y vista compartida. Sólo existe en esta demo.',btn('Escanear carta','scan',true)+btn('Compartir','share')+btn('Todas las colecciones','collection'))}<div class="two"><div class="stack-lg"><div class="filter-row" aria-label="Filtrar colección">${[['all','Todas'],['offers','Para intercambio'],['saved','Guardadas demo']].map(([f,label])=>`<button data-filter="${f}" aria-pressed="${filter===f}">${label}</button>`).join('')}</div>${ids.length?`<div class="${direction==='atlas'?'album':''}"><div class="cards ${direction==='mesa'?'wide-grid':''}">${ids.map(tile).join('')}</div></div>`:`<section class="panel stack"><h2>Todavía no hay cartas</h2><p class="muted">Probá guardar una carta de muestra desde el recorrido de escaneo.</p>${btn('Probar escaneo','scan')}</section>`}${history()}</div><aside class="stack-lg">${goalPanel()}${valuePanel()}<section class="panel stack"><span class="badge proposal">Intercambios</span><h2>Repetida no es disponible</h2><p class="muted">Elegí expresamente qué ofrecés. Tener varias copias no las publica.</p>${btn('Preparar mesa','trade')}</section></aside></div></div>`}
function detail(){const c=samples[current];return `<div class="stack-lg">${title('Ficha editorial',c.name,'Ilustración abstracta para evaluar la interfaz. No identifica una edición real.',btn('Volver','collection'))}<div class="details"><section class="panel stack">${art(current)}<p class="caption">Sin foto de una carta real ni reconocimiento ejecutado.</p></section><div class="stack-lg">${valuePanel()}<section class="panel stack"><h2>Elegí dónde guardarla</h2>${collectionDestination('detail-destination')}<p class="muted">Definí una intención sin modificar tu cuenta.</p><div class="row">${btn('Guardar muestra','save-detail',true)}${btn(offered.includes(current)?'Quitar de mesa':'Ofrecer muestra','toggle-offer')}${btn(wanted.includes(current)?'Quitar deseada':'Marcar deseada','toggle-wanted')}</div><div class="detail-list"><div><span class="caption">Variante</span><p>Por confirmar</p></div><div><span class="caption">Condición</span><p>Sin evaluar</p></div></div><p class="caption">La imagen no permite certificar acabado ni condición. La referencia de precio debe corresponder a la variante elegida.</p></section></div></div>${history()}</div>`}
function scan(){if(stage==='idle')return `<div class="stack-lg">${title('Recorrido de escaneo','De carta a colección.','Capturar, revisar y guardar son pasos distintos.',btn('Volver','home'))}<div class="scanner"><div class="scan-stage"><div class="frame"></div>${art(0)}<p class="caption">Encuadre ilustrado · Cámara apagada</p></div><div class="stack-lg"><span class="badge">Demostración sin cámara</span><h2>Una captura. Una decisión clara.</h2><p class="muted">En el producto: cámara en teléfono y foto en escritorio. Acá podés probar la revisión con una carta editorial, sin permisos ni envío de fotos.</p>${btn('Usar muestra','sample',true)}<div class="process"><div><b>Capturá</b><span class="caption">Iniciá la lectura</span></div><div><b>Revisá</b><span class="caption">Confirmá identidad</span></div><div><b>Guardá</b><span class="caption">Elegí colección</span></div></div></div></div></div>`;
 if(stage==='review')return `<div class="stack-lg">${title('Paso de revisión','Revisá antes de sumar.','Propuesta ilustrativa; no es un resultado del reconocimiento.',btn('Cancelar','reset-scan'))}<div class="scanner"><div class="panel">${art(current)}</div><section class="stack-lg"><span class="badge">Identidad por confirmar</span><h2>${samples[current].name}</h2><p class="muted">En una lectura real, verificá nombre, set y número. La similitud no certifica la variante.</p><label class="stack">Cambiar muestra<select id="candidate">${samples.map((c,i)=>`<option value="${i}" ${i===current?'selected':''}>${c.name}</option>`).join('')}</select></label><div class="value-note">Precio sin consultar · Variante y condición pendientes</div>${btn('Confirmar muestra','confirm',true)}<p class="caption">Confirmar la deja en esta sesión demo. Todavía no está guardada.</p></section></div></div>`;
 return `<div class="stack-lg">${title('Organización de muestra','Lista para organizar.','La muestra está en la sesión, pero todavía no se guardó.',btn('Descartar muestra','reset-scan'))}<div class="two"><section class="panel stack-lg"><div class="review"><div>${art(session)}</div><div class="stack"><span class="badge">En sesión demo</span><h2>${samples[session].name}</h2><p class="muted">Variante y condición sin evaluar</p><p class="caption">La maqueta no asigna NM ni una variante por su cuenta.</p></div></div>${collectionDestination('destination')}${btn('Guardar muestra','save-scan',true)}<p class="caption">Sólo memoria local de esta página. No escribe en la API.</p></section><aside>${valuePanel()}</aside></div></div>`}
function trade(){return `<div class="stack-lg">${title('Modo encuentro · Propuesta','Tu mesa, tus reglas.','Separá lo que ofrecés de lo que buscás. Sin participantes ni propuestas reales.',btn('Vista compartida','share',true))}<div class="trade-pair"><section class="trade-side stack"><div class="between"><span class="arrow-disc">${icon('swap')}</span><span class="badge">Ofrezco · Demo</span></div><h2>Lo que puede cambiar</h2><p class="muted">Seleccioná desde la ficha. Cada carta requiere una decisión explícita.</p>${offered.length?`<div class="cards">${offered.map(tile).join('')}</div>`:'<p>No elegiste cartas para ofrecer en esta maqueta.</p>'}${btn('Elegir cartas','collection')}</section><section class="trade-side stack"><div class="between"><span class="arrow-disc">${icon('target')}</span><span class="badge proposal">Busco · Demo</span></div><h2>Tu próximo hallazgo</h2><p class="muted">Tus deseadas dan contexto a la conversación, sin publicar todo el inventario.</p>${wanted.length?`<div class="cards">${wanted.map(tile).join('')}</div>`:'<p>No elegiste deseadas en esta maqueta.</p>'}${btn('Explorar deseadas','goals')}</section></div><div class="compare-note"><b>Valor orientativo, no equivalencia garantizada.</b><p>No hay cotizaciones en este prototipo. Condición, variante y mercado pueden cambiar lo que cada persona acepta.</p></div></div>`}
function goals(){const items=collectionGoals();return `<div class="stack-lg">${title('Colecciones / Objetivos','Dale rumbo al álbum.','Cada colección tiene sus propios objetivos. Elegí una sugerencia o escribí el tuyo.',btn('Crear objetivo','new-goal',true)+btn('Ver colección','collection-detail'))}${goalsCollectionSelector()}<div class="goal-management"><section class="stack-lg" aria-label="Objetivos de esta colección">${items.length?items.map((g,i)=>`<article class="panel goal-item"><span class="badge">${i===0?'Próximo objetivo':'Objetivo de colección'}</span><h2>${escapeMarkup(g.title)}</h2><p class="caption">${escapeMarkup(activeCollection().name)} · Sin progreso calculado</p><div class="goal-actions"><button data-edit-goal="${g.id}">Editar objetivo</button>${i===0?'':`<button data-next-goal="${g.id}">Elegir como próximo</button>`}</div></article>`).join(''):`<section class="panel stack"><h2>Elegí tu primer objetivo</h2><p class="muted">Esta colección todavía no tiene objetivos. Creá uno o adaptá una sugerencia.</p>${btn('Crear objetivo','new-goal')}</section>`}</section><aside class="panel stack goal-suggestion"><span class="badge proposal">Sugerencia editorial</span><h2>${escapeMarkup(suggestedGoal())}</h2><p class="muted">Una idea según el tipo de colección, no una recomendación de compra ni un objetivo ya aceptado.</p><div class="goal-actions">${btn('Usar sugerencia','use-goal-suggestion')}${btn('Generar otra','next-goal-suggestion')}</div><p class="caption">Usar una sugerencia abre el editor. Sólo se agrega cuando la guardás.</p></aside></div><p class="goal-summary">Encontrás este mismo acceso en Colecciones → tu colección → Tu próximo objetivo. Los cambios se reflejan también en Inicio y viven sólo en esta maqueta.</p></div>`}
function share(){return `<div class="stack-lg">${title('Vista compartida · Propuesta','Mostrá sólo lo elegido.','Esta vista previa no publica un enlace ni expone datos de tu cuenta.',btn('Volver','collection'))}<div class="two"><section class="preview-public stack-lg"><div class="stack"><span class="eyebrow">PokéScan / Vitrina de muestra</span><h2 class="public-title">${escapeMarkup(activeCollection().name)}</h2><p class="muted">Vista previa de las cartas que elegiste ofrecer dentro de esta colección.</p></div><div class="cards">${offered.filter(i=>activeCollection().items.includes(i)).map(tile).join('')}</div>${offered.some(i=>activeCollection().items.includes(i))?'':'<p>No hay cartas de esta colección seleccionadas para ofrecer.</p>'}<div id="shared-value" ${demoPrivacy.showValues?'':'hidden'} class="value-note">Valor no disponible · No hay precios conectados.</div><p class="caption">Sin inventario completo, datos personales ni valor total de la cuenta.</p></section><aside class="panel stack"><span class="badge proposal">Privacidad por elección</span><h2>Antes de compartir</h2><label class="check-row"><input id="show-values" type="checkbox" ${demoPrivacy.showValues?'checked':''}>Mostrar referencia de valor</label><p class="caption">Sólo afecta esta vista previa. No cambia permisos reales.</p>${btn('Revisar selección','trade')}<div class="value-note">Publicación desactivada en el prototipo. No se genera un enlace público.</div></aside></div></div>`}
function searchView(){return `<div class="stack-lg">${title('Catálogo de muestra','Buscá tu próximo hallazgo.','Combiná nombre, set y colección. Elegí cómo ordenar los resultados.',btn('Escanear carta','scan',true))}<div class="search-layout"><aside class="panel search-aside stack"><span class="eyebrow">Explorar con intención</span><h2>Encontrá la indicada</h2><p class="caption">Set es la expansión de una carta. Colección es el álbum donde la guardás.</p><p class="caption">Los filtros se combinan; el orden no descarta resultados.</p>${btn('Ver objetivos','goals')}</aside><section class="stack-lg" aria-label="Búsqueda y filtros"><label class="search-field" for="search-input">Buscar por nombre<input id="search-input" type="search" placeholder="Probá con Pikachu" autocomplete="off"></label><div class="panel search-controls"><label for="search-set">Set / expansión<select id="search-set"><option value="all">Todos los sets</option>${[...new Set(sampleSets)].map(set=>`<option value="${set}" ${searchState.set===set?'selected':''}>${set}</option>`).join('')}</select></label><label for="search-collection">Colección<select id="search-collection"><option value="all">Todo el catálogo demo</option>${demoCollections.map(c=>`<option value="${c.id}" ${searchState.collection===c.id?'selected':''}>${escapeMarkup(c.name)}</option>`).join('')}<option value="saved" ${searchState.collection==='saved'?'selected':''}>Guardadas en la demo</option></select></label><label for="search-sort">Ordenar por<select id="search-sort">${[['name','Nombre'],['set','Set / expansión'],['price','Precio de mercado']].map(([value,label])=>`<option value="${value}" ${searchState.sort===value?'selected':''}>${label}</option>`).join('')}</select></label><label for="search-direction">Sentido<select id="search-direction"><option value="asc" ${searchState.direction==='asc'?'selected':''}>Menor a mayor / A–Z</option><option value="desc" ${searchState.direction==='desc'?'selected':''}>Mayor a menor / Z–A</option></select></label><button class="search-reset" data-action="reset-search">Limpiar filtros</button></div><p class="caption">Sets asignados sólo para probar filtros sobre seis ilustraciones; no identifican ediciones reales. “Guardadas” usa lo que sumes en esta sesión demo.</p><p id="search-price-note" class="search-price-note" ${searchState.sort==='price'?'':'hidden'}>Sin cotizaciones conectadas: no podemos ordenar estas muestras por precio. Se mantienen por nombre A–Z; en el producto, las cartas sin precio irían al final en ambos sentidos.</p><p id="search-summary" class="search-summary" role="status" aria-live="polite">${searchIds().length===1?'1 carta de muestra':searchIds().length+' cartas de muestra'}</p><div id="search-results" class="cards wide-grid">${searchResults()}</div></section></div></div>`}
function settings(){return `<div class="stack-lg">${title('Cuenta y preferencias','Tu cuenta, en orden.','Datos, seguridad, colecciones y privacidad reunidos. Maqueta sin cuenta conectada.',btn('Volver','home'))}<section class="panel account-overview"><span class="account-avatar" aria-hidden="true">P</span><div class="stack"><h2>${demoProfile.name?escapeMarkup(demoProfile.name):'Tu perfil'}</h2><p class="muted">Sin cuenta conectada · No consultamos datos personales.</p></div></section><div class="settings-grid"><div class="stack-lg"><section class="panel stack"><span class="eyebrow">Perfil y seguridad</span><div class="settings-row"><div><h2>Datos personales</h2><p class="caption">Nombre visible y correo de la cuenta.</p></div>${btn('Editar datos','profile')}</div><div class="settings-row"><div><h3>Clave de acceso</h3><p class="caption">Actualizá tu contraseña desde un flujo protegido.</p></div>${btn('Cambiar clave','password')}</div><div class="settings-row"><div><h3>Sesiones y dispositivos</h3><p class="caption">No hay sesiones reales consultadas en esta maqueta.</p></div></div></section><section class="panel stack"><div class="between"><h2>Mis colecciones</h2><span class="badge">${demoCollections.length} álbumes demo</span></div><div class="account-collections">${demoCollections.map(c=>`<button data-open-collection="${c.id}"><span>${escapeMarkup(c.name)}</span><span aria-hidden="true">→</span></button>`).join('')}</div>${btn('Administrar colecciones','collection')}</section></div><div class="stack-lg"><section class="panel stack pro-panel"><div class="between"><span class="eyebrow">Suscripción</span><span class="badge proposal">PRO · Próximamente</span></div><h2>Un lugar para PRO</h2><p class="muted">Acá verías tu plan, suscripción y facturación cuando estén disponibles.</p><p class="caption">Plan no consultado. Sin precios, beneficios, cobros ni suscripción simulados.</p>${btn('Ver suscripción','subscription')}</section><section class="panel stack"><h2>Privacidad y políticas</h2><p class="muted">Elegí qué mostrar al compartir y consultá las condiciones de uso.</p><label class="check-row"><input id="privacy-values" type="checkbox" ${demoPrivacy.showValues?'checked':''}>Mostrar valores en la vista compartida demo</label><p class="caption">No cambia permisos reales ni publica ninguna colección. Las políticas se consultan; no se editan desde la cuenta.</p><div class="row">${btn('Ver políticas','policies')}${btn('Vista compartida','share')}</div></section><section class="panel stack"><h2>Preferencias y cuenta</h2>${btn(theme?'Usar claro':'Usar oscuro','theme')}<div class="separator"></div><button disabled>Cerrar sesión</button><button disabled>Eliminar cuenta</button><p class="caption">Acciones de cuenta deshabilitadas: no hay sesión real. La eliminación requeriría su propia confirmación.</p>${btn('Reiniciar muestra','reset-demo')}</section></div></div></div>`}
function profileView(){return `<div class="stack-lg form-page">${title('Datos personales','Tu identidad de cuenta.','No cargamos datos reales. Podés probar un nombre visible sólo en memoria.',btn('Volver','settings'))}<section class="panel"><form id="profile-form"><label class="form-field" for="profile-name">Nombre visible<input id="profile-name" name="name" maxlength="80" value="${escapeMarkup(demoProfile.name)}" placeholder="Nombre para esta muestra" aria-describedby="profile-error"></label><label class="form-field" for="profile-email">Correo de la cuenta<input id="profile-email" type="email" disabled placeholder="Sin cuenta conectada"></label><p class="caption">Cambiar correo requeriría validación y un flujo de seguridad. No está habilitado en la maqueta.</p><p id="profile-error" class="form-error" role="alert"></p><button type="submit" class="primary">Guardar muestra</button></form></section></div>`}
function passwordView(){return `<div class="stack-lg form-page">${title('Seguridad de la cuenta','Cambiar clave.','Vista del flujo previsto. No ingreses contraseñas reales.',btn('Volver','settings'))}<section class="panel stack"><label class="form-field" for="password-current">Contraseña actual<input id="password-current" type="password" autocomplete="off" disabled placeholder="Deshabilitado en la maqueta"></label><label class="form-field" for="password-new">Nueva contraseña<input id="password-new" type="password" autocomplete="off" disabled placeholder="Deshabilitado en la maqueta"></label><label class="form-field" for="password-confirm">Repetir nueva contraseña<input id="password-confirm" type="password" autocomplete="off" disabled placeholder="Deshabilitado en la maqueta"></label><button disabled>Actualizar clave</button><p class="caption">En producción requerirá autenticación y validación del servidor. Esta maqueta no captura, guarda ni envía contraseñas.</p></section></div>`}

function subscriptionView(){return `<div class="stack-lg form-page">${title('Suscripción y facturación','Tu plan en PokéScan.','Sección preparada para la futura versión PRO. Sin conexión a facturación.',btn('Volver','settings'))}<section class="panel stack pro-panel"><span class="badge proposal">PRO · Próximamente</span><h2>Plan no disponible</h2><p class="muted">Cuando se defina PRO, acá se verían plan actual, estado, renovación y gestión de la suscripción.</p><p class="caption">No hay precio, promesa de beneficios, fecha de lanzamiento ni plan activo inventados.</p><button disabled>Gestionar suscripción</button></section></div>`}
const views={home,'goal-editor':goalEditor,showcase:showcaseView,collection:collectionOverview,'collection-detail':collectionDetail,'create-collection':createCollectionView,detail,scan,trade,goals,share,search:searchView,settings,profile:profileView,password:passwordView,policies:policiesView,subscription:subscriptionView};
function render(focus=false){document.getElementById('content').innerHTML=views[view]()+note();document.querySelectorAll('[data-nav]').forEach(el=>{if(el.dataset.nav===view||el.dataset.nav==='collection'&&['detail','goals','share','trade','collection-detail','create-collection','goal-editor'].includes(view)||el.dataset.nav==='settings'&&['profile','password','policies','subscription'].includes(view))el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});if(focus){window.scrollTo(0,0);document.getElementById('page-title')?.focus({preventScroll:true})}}
function go(next){view=next;render(true);if(view==='search')document.getElementById('search-input').value=searchState.query}
function announce(message){document.getElementById('notice').textContent=message}
function toggle(list,id){const n=list.indexOf(id);if(n>=0)list.splice(n,1);else list.push(id)}
document.addEventListener('click',event=>{const control=event.target.closest('button');if(!control)return;if(control.dataset.nav){go(control.dataset.nav);return}if(control.dataset.goalsCollection){if(!demoCollections.some(c=>c.id===control.dataset.goalsCollection))return;activeCollectionId=control.dataset.goalsCollection;go('goals');return;}if(control.dataset.editGoal){const goal=demoGoals.find(g=>g.id===control.dataset.editGoal&&g.collectionId===activeCollectionId);if(!goal)return;editingGoalId=goal.id;goalDraftTitle='';go('goal-editor');return;}if(control.dataset.nextGoal){const id=control.dataset.nextGoal;const index=demoGoals.findIndex(g=>g.id===id&&g.collectionId===activeCollectionId);if(index<0)return;const [goal]=demoGoals.splice(index,1);demoGoals.unshift(goal);render();document.querySelector(`[data-edit-goal="${goal.id}"]`)?.focus();announce('Próximo objetivo actualizado para esta colección.');return;}if(control.dataset.showcaseMode){showcase.mode=control.dataset.showcaseMode;render();document.querySelector(`[data-showcase-mode="${showcase.mode}"]`)?.focus();return;}if(control.dataset.openCollection){activeCollectionId=control.dataset.openCollection;filter='all';go('collection-detail');return;}if(control.hasAttribute('data-detail')){current=Number(control.dataset.detail);go('detail');return}if(control.dataset.filter){filter=control.dataset.filter;render();document.querySelector(`[data-filter="${filter}"]`)?.focus();return}const a=control.dataset.action;if(!a)return;if(a==='new-goal'||a==='use-goal-suggestion'){editingGoalId=null;goalDraftTitle=a==='use-goal-suggestion'?suggestedGoal():'';go('goal-editor');return;}if(a==='next-goal-suggestion'){suggestionPositions.set(activeCollectionId,((suggestionPositions.get(activeCollectionId)||0)+1)%3);render();document.querySelector('[data-action="next-goal-suggestion"]')?.focus();announce('Nueva sugerencia: '+suggestedGoal());return;}if(a==='apply-showcase'){showcase.cursor=0;persistShowcase((showcase.cursor+1)%Math.max(showcase.pool.length,1));go('home');announce(showcaseStorageAvailable?'Vitrina personalizada en esta pestaña.':'Vitrina aplicada, pero no se pudo conservar la preferencia.');return;}if(a==='reset-search'){resetSearch();return;}if(['home','collection','scan','trade','share','goals','search','settings','create-collection','profile','password','policies','subscription','showcase','collection-detail'].includes(a)){go(a);return}if(a==='theme'){theme=!theme;document.documentElement.classList.toggle('dark',theme);document.querySelectorAll('[data-theme-label]').forEach(el=>el.textContent=theme?'Tema claro':'Tema oscuro');if(view==='settings')render();return}if(a==='sample'){current=0;stage='review';render(true);return}if(a==='reset-scan'){session=null;stage='idle';render(true);return}if(a==='confirm'){session=current;stage='organize';render(true);announce('Muestra confirmada en sesión. Todavía no se guardó.');return}if(a==='save-scan'||a==='save-detail'){const id=a==='save-scan'?session:current;saveToCollection(id);session=null;stage='idle';filter='all';go('collection-detail');announce('Muestra guardada en '+activeCollection().name+' sólo en este prototipo.');return}if(a==='toggle-offer'){toggle(offered,current);render();document.querySelector('[data-action="toggle-offer"]')?.focus();announce(offered.includes(current)?'Muestra añadida a tu mesa demo.':'Muestra retirada de tu mesa demo.');return}if(a==='toggle-wanted'){toggle(wanted,current);render();document.querySelector('[data-action="toggle-wanted"]')?.focus();announce(wanted.includes(current)?'Muestra marcada como deseada.':'Muestra retirada de deseadas.');return}if(a==='reset-demo'){demoGoals=[];nextGoalId=1;editingGoalId=null;goalDraftTitle='';suggestionPositions.clear();demoCollections=initialCollections();showcase=defaultShowcase();persistShowcase((showcase.cursor+1)%Math.max(showcase.pool.length,1));activeCollectionId='pikachus';nextCollectionId=1;demoProfile={name:''};demoPrivacy={showValues:false};Object.assign(searchState,{query:'',set:'all',collection:'all',sort:'name',direction:'asc'});saved=[];offered=[1];wanted=[4];session=null;stage='idle';filter='all';go('home');announce('Se reinició la muestra. Tu cuenta no se modificó.')}});
document.addEventListener('change',event=>{if(event.target.id==='goal-collection'){if(!demoCollections.some(c=>c.id===event.target.value))return;activeCollectionId=event.target.value;render();document.getElementById('goal-collection').focus();return;}if(event.target.hasAttribute?.('data-showcase-card')){const id=Number(event.target.dataset.showcaseCard);if(!ownedSampleIds().includes(id))return;if(event.target.checked){if(!showcase.pool.includes(id))showcase.pool.push(id)}else showcase.pool=showcase.pool.filter(i=>i!==id);showcase.cursor=0;return;}if(['destination','detail-destination'].includes(event.target.id)){if(demoCollections.some(c=>c.id===event.target.value))activeCollectionId=event.target.value;return;}if(['privacy-values','show-values'].includes(event.target.id)){demoPrivacy.showValues=event.target.checked;if(event.target.id==='show-values')document.getElementById('shared-value').hidden=!event.target.checked;return;}const key={'search-set':'set','search-collection':'collection','search-sort':'sort','search-direction':'direction'}[event.target.id];if(key){searchState[key]=event.target.value;updateSearchResults();return;}if(event.target.id==='candidate'){current=Number(event.target.value);render();document.getElementById('candidate').focus()}if(event.target.id==='show-values')document.getElementById('shared-value').hidden=!event.target.checked});
document.addEventListener('input',event=>{if(event.target.id!=='search-input')return;searchState.query=event.target.value;updateSearchResults();});
document.addEventListener('submit',event=>{
 if(event.target.id==='goal-form'){
  event.preventDefault();const input=document.getElementById('goal-title');const title=input.value.trim();
  if(!title||title.length>120){document.getElementById('goal-error').textContent='Escribí un objetivo de 1 a 120 caracteres.';input.setAttribute('aria-invalid','true');input.focus();return;}
  if(editingGoalId){const goal=demoGoals.find(g=>g.id===editingGoalId&&g.collectionId===activeCollectionId);if(!goal){announce('Este objetivo ya no está disponible.');return;}goal.title=title;}
  else demoGoals.push({id:'goal-'+nextGoalId++,collectionId:activeCollectionId,title});
  editingGoalId=null;goalDraftTitle='';go('goals');announce('Objetivo guardado sólo en esta maqueta.');return;
 }

 if(event.target.id==='create-collection-form'){
  event.preventDefault();const input=document.getElementById('collection-name');const name=input.value.trim();
  if(!name||name.length>80){document.getElementById('collection-form-error').textContent='Escribí un nombre de 1 a 80 caracteres.';input.setAttribute('aria-invalid','true');input.focus();return;}
  const kind=document.getElementById('collection-kind').value;const id='custom-'+nextCollectionId++;
  demoCollections.push({id,name,kind:['Personalizada','Por Pokémon','Por expansión'].includes(kind)?kind:'Personalizada',items:[]});activeCollectionId=id;filter='all';go('collection-detail');announce('Colección creada sólo en esta maqueta.');
 }
 if(event.target.id==='profile-form'){
  event.preventDefault();const input=document.getElementById('profile-name');const name=input.value.trim();
  if(!name||name.length>80){document.getElementById('profile-error').textContent='Escribí un nombre de 1 a 80 caracteres.';input.setAttribute('aria-invalid','true');input.focus();return;}
  demoProfile.name=name;go('settings');announce('Nombre actualizado sólo en esta muestra.');
 }
});
render();
</script></body></html>
