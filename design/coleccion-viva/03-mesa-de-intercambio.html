 {name:'Mew',kind:'Origen',tone:'ink',shape:'orbit'}
];
const paths={bolt:'M110 24 58 105h40l-12 72 62-97h-44z',moon:'M135 38c-64 12-77 98-13 127-86 18-113-110-33-138 12-4 30-3 46 11z',flame:'M99 22c8 45 58 60 50 110-7 51-81 61-96 9-10-32 10-58 27-77-1 26 12 32 18 37 12-30 0-52 1-79z',leaf:'M154 32C83 30 39 77 54 122s87 39 98-16c5-27-4-46 2-74zM65 147l71-95M82 116l-5-32M104 94l30 3',star:'M100 22l21 55 58 2-46 38 15 58-48-34-49 34 16-58-46-38 58-2z',orbit:'M100 43c75 0 75 114 0 114s-75-114 0-114zM30 140C-4 97 167 18 181 67c12 46-119 116-151 73z'};
const icons={home:'M3 10 12 3l9 7v11h-6v-7H9v7H3z',search:'M20 20l-5-5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0',scan:'M3 8V3h5m8 0h5v5m0 8v5h-5M8 21H3v-5M7 12h10',collection:'M5 3h14v18H5zM9 3v18M5 9h14M5 15h14',settings:'M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2',swap:'M3 7h17l-4-4M21 17H4l4 4',target:'M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8',plus:'M12 5v14M5 12h14'};
let view='home',current=0,session=null,saved=[],offered=[1],wanted=[4],filter='all',search='',stage='idle',theme=false;
let lastDialogFocus;
function icon(name){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${icons[name]||icons.plus}"/></svg>`}
function art(i){const c=samples[i];return `<div class="card-art ${c.tone}" aria-hidden="true"><span class="card-name">${c.name}</span><svg viewBox="0 0 200 200" fill="none"><circle cx="100" cy="100" r="84" stroke="currentColor" stroke-width="1"/><circle cx="100" cy="100" r="68" stroke="currentColor" stroke-width="1" stroke-dasharray="2 8"/><path d="${paths[c.shape]}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="card-foot"><span>${c.kind}<br><span class="edition">Estudio visual</span></span><span>✧</span></span></div>`}
function tile(i){const c=samples[i];return `<button class="tile" data-detail="${i}" aria-label="Ver detalle de ${c.name}">${art(i)}<h3>${c.name}</h3><span class="caption">Ilustración editorial · Sin cotización</span></button>`}
function btn(text,action,primary=false){return `<button ${primary?'class="primary"':''} data-action="${action}">${text}</button>`}
function title(label,heading,description,actions=''){return `<header class="section-head"><div class="stack"><span class="eyebrow">${label}</span><h1 id="page-title" tabindex="-1">${heading}</h1><p class="muted">${description}</p></div>${actions?`<div class="row">${actions}</div>`:''}</header>`}
function note(){return `<footer class="page-note"><p><b>Prototipo ${config.number} · ${config.title}.</b> ${config.tradeoff}</p><p>Selección editorial, no inventario real. Dibujos abstractos, no imágenes de cartas. Sin conexión a tu cuenta, sin precios inventados ni persistencia. Deseadas, objetivos y modo encuentro son propuestas.</p></footer>`}
function valuePanel(){return `<section class="panel stack" aria-label="Valor de referencia"><div class="between"><span class="eyebrow">Valor de referencia</span><span class="badge">USD</span></div><p class="metric-value" aria-label="Sin referencia de valor">—</p><p class="muted">Sin cotizaciones conectadas en esta maqueta.</p><div class="value-note">TCGplayer vía TCGCSV en el producto. Una conversión a ARS no equivale a un precio de venta local.</div><details><summary>Cómo se calcula</summary><p class="caption">Sólo se suman copias con precio para su variante. Un total parcial debe indicar cobertura; la condición registrada no ajusta esa referencia.</p></details></section>`}
function history(){return `<section class="panel stack"><div class="between"><h2>Evolución del valor</h2><span class="badge">Sin serie</span></div><div class="empty-chart"><div class="stack"><b>Una historia con datos reales.</b><p class="caption">Acá aparecerán observaciones disponibles. No dibujamos una tendencia sin historial.</p></div></div><p class="caption">El valor de la colección también cambia al sumar o retirar cartas. No representa rentabilidad.</p></section>`}
function goalPanel(){return `<section class="panel stack"><div class="between"><h2>Tu próximo objetivo</h2><span class="badge proposal">Propuesta</span></div><div class="goal"><span class="goal-mark">${icon('target')}</span><div><h3>Un lugar para cada carta</h3><p class="caption">Elegí qué querés coleccionar.</p></div></div>${btn('Explorar objetivos','goals')}<p class="caption">Por expansión, Pokémon o ilustrador. Sin progreso ficticio.</p></section>`}
function home(){
 if(direction==='atlas')return `<div class="atlas"><aside class="atlas-menu panel stack"><span class="eyebrow">Tu atlas personal</span><h2>Coleccionar con rumbo.</h2><div class="menu-buttons">${btn('Vista general','home')}${btn('Mi colección','collection')}${btn('Objetivos','goals')}${btn('Intercambios','trade')}</div><div class="separator"></div><p class="caption">La colección de muestra no está conectada a tu inventario.</p></aside><div class="stack-lg">${title('02 / Orden y descubrimiento','Cada carta cuenta.','Mirar lo que tenés. Encontrar lo que falta. Elegir qué sigue.',btn('Escanear carta','scan',true))}<div class="workspace"><section class="stack"><div class="between"><h2>Tu archivo visual</h2>${btn('Abrir colección','collection')}</div><div class="album"><div class="cards">${[0,1,2,3].map(tile).join('')}<button class="missing" data-action="goals">${icon('plus')}<b>Tu próximo hallazgo</b><span class="caption">Definí una deseada</span></button><button class="missing" data-action="scan">${icon('scan')}<b>Sumar una carta</b><span class="caption">Probá el recorrido</span></button></div></div></section><aside class="stack">${goalPanel()}${valuePanel()}</aside></div>${history()}</div></div>`;
 if(direction==='mesa')return `<div class="stack-lg">${title('03 / Coleccionar y conectar','Encontrá el próximo cambio.','Una mesa para mostrar lo que ofrecés, sin exponer toda tu colección.',btn('Escanear carta','scan',true))}<section class="trade-hero"><div class="stack"><span class="badge proposal">Modo encuentro · Propuesta</span><h2 class="large">Lo que te sobra.<br>Lo que te falta.</h2><p class="muted">Prepará una selección antes de compartir. Vos elegís qué cartas y qué datos mostrar.</p><div class="row">${btn('Preparar mesa','trade')}${btn('Vista compartida','share')}</div></div><div class="process"><div><b>Elegí</b><span class="caption">Lo disponible</span></div><div><b>Mostrá</b><span class="caption">Lo que buscás</span></div><div><b>Revisá</b><span class="caption">Cada propuesta</span></div></div></section><div class="trade-pair"><section class="trade-side stack"><div class="between"><h2>Para ofrecer</h2><span class="badge">Selección demo</span></div><div class="cards">${[1,2].map(tile).join('')}</div>${btn('Editar selección','trade')}</section><section class="trade-side stack"><div class="between"><h2>Para descubrir</h2><span class="badge proposal">Deseadas</span></div><div class="cards">${[4,5].map(tile).join('')}</div>${btn('Ver deseadas','goals')}</section></div><div class="three">${goalPanel()}${valuePanel()}<section class="panel stack"><h2>Tu colección, privada</h2><p class="muted">Compartir no tiene por qué mostrar cuánto vale todo lo que tenés.</p>${btn('Revisar privacidad','share')}</section></div></div>`;
 return `<div class="stack-lg"><section class="hero"><div class="stack-lg"><div class="stack"><span class="eyebrow">01 / Tu colección viva</span><h1 id="page-title" tabindex="-1">Tus cartas<br>cuentan historias.</h1><p class="muted">Guardalas en un lugar propio. Descubrí su valor y elegí cuál va a ser tu próximo hallazgo.</p></div><div class="row">${btn('Escanear carta','scan',true)}${btn('Ver colección','collection')}</div><p class="caption">Colección de muestra · Sin datos de tu cuenta</p></div><div class="shelf">${[1,2,0].map(art).join('')}</div></section><div class="two"><div class="stack-lg"><section class="stack"><div class="between section-label"><div><span class="eyebrow">Tu vitrina</span><h2>Cartas que cuentan algo.</h2></div>${btn('Ver todas','collection')}</div><div class="cards">${[0,1,3,4].map(tile).join('')}</div></section><section class="panel between"><div class="stack"><span class="badge proposal">Compartir con intención</span><h2>Una vitrina para mostrar.</h2><p class="muted">Elegí qué mostrar. Tu inventario completo queda afuera.</p></div>${btn('Vista compartida','share')}</section></div><aside class="stack-lg">${valuePanel()}${goalPanel()}</aside></div></div>`;
}
function collection(){let ids=filter==='offers'?offered:filter==='saved'?saved:[0,1,2,3,4,5];return `<div class="stack-lg">${title('Colección de muestra','Tu colección, a mano.','Explorá esta selección editorial. Lo que guardes acá vive sólo hasta recargar.',btn('Escanear carta','scan',true)+btn('Compartir','share'))}<div class="two"><div class="stack-lg"><div class="filter-row" aria-label="Filtrar colección">${[['all','Todas'],['offers','Para intercambio'],['saved','Guardadas demo']].map(([f,label])=>`<button data-filter="${f}" aria-pressed="${filter===f}">${label}</button>`).join('')}</div>${ids.length?`<div class="${direction==='atlas'?'album':''}"><div class="cards ${direction==='mesa'?'wide-grid':''}">${ids.map(tile).join('')}</div></div>`:`<section class="panel stack"><h2>Todavía no hay cartas</h2><p class="muted">Probá guardar una carta de muestra desde el recorrido de escaneo.</p>${btn('Probar escaneo','scan')}</section>`}${history()}</div><aside class="stack-lg">${valuePanel()}<section class="panel stack"><span class="badge proposal">Intercambios</span><h2>Repetida no es disponible</h2><p class="muted">Elegí expresamente qué ofrecés. Tener varias copias no las publica.</p>${btn('Preparar mesa','trade')}</section></aside></div></div>`}
function detail(){const c=samples[current];return `<div class="stack-lg">${title('Ficha editorial',c.name,'Ilustración abstracta para evaluar la interfaz. No identifica una edición real.',btn('Volver','collection'))}<div class="details"><section class="panel stack">${art(current)}<p class="caption">Sin foto de una carta real ni reconocimiento ejecutado.</p></section><div class="stack-lg">${valuePanel()}<section class="panel stack"><h2>Dentro de tu colección</h2><p class="muted">Definí una intención sin modificar tu cuenta.</p><div class="row">${btn(saved.includes(current)?'Ver guardadas':'Guardar muestra',saved.includes(current)?'collection':'save-detail',true)}${btn(offered.includes(current)?'Quitar de mesa':'Ofrecer muestra','toggle-offer')}${btn(wanted.includes(current)?'Quitar deseada':'Marcar deseada','toggle-wanted')}</div><div class="detail-list"><div><span class="caption">Variante</span><p>Por confirmar</p></div><div><span class="caption">Condición</span><p>Sin evaluar</p></div></div><p class="caption">La imagen no permite certificar acabado ni condición. La referencia de precio debe corresponder a la variante elegida.</p></section></div></div>${history()}</div>`}
function scan(){if(stage==='idle')return `<div class="stack-lg">${title('Recorrido de escaneo','De carta a colección.','Capturar, revisar y guardar son pasos distintos.',btn('Volver','home'))}<div class="scanner"><div class="scan-stage"><div class="frame"></div>${art(0)}<p class="caption">Encuadre ilustrado · Cámara apagada</p></div><div class="stack-lg"><span class="badge">Demostración sin cámara</span><h2>Una captura. Una decisión clara.</h2><p class="muted">En el producto: cámara en teléfono y foto en escritorio. Acá podés probar la revisión con una carta editorial, sin permisos ni envío de fotos.</p>${btn('Usar muestra','sample',true)}<div class="process"><div><b>Capturá</b><span class="caption">Iniciá la lectura</span></div><div><b>Revisá</b><span class="caption">Confirmá identidad</span></div><div><b>Guardá</b><span class="caption">Elegí colección</span></div></div></div></div></div>`;
 if(stage==='review')return `<div class="stack-lg">${title('Paso de revisión','Revisá antes de sumar.','Propuesta ilustrativa; no es un resultado del reconocimiento.',btn('Cancelar','reset-scan'))}<div class="scanner"><div class="panel">${art(current)}</div><section class="stack-lg"><span class="badge">Identidad por confirmar</span><h2>${samples[current].name}</h2><p class="muted">En una lectura real, verificá nombre, set y número. La similitud no certifica la variante.</p><label class="stack">Cambiar muestra<select id="candidate">${samples.map((c,i)=>`<option value="${i}" ${i===current?'selected':''}>${c.name}</option>`).join('')}</select></label><div class="value-note">Precio sin consultar · Variante y condición pendientes</div>${btn('Confirmar muestra','confirm',true)}<p class="caption">Confirmar la deja en esta sesión demo. Todavía no está guardada.</p></section></div></div>`;
 return `<div class="stack-lg">${title('Organización de muestra','Lista para organizar.','La muestra está en la sesión, pero todavía no se guardó.',btn('Descartar muestra','reset-scan'))}<div class="two"><section class="panel stack-lg"><div class="review"><div>${art(session)}</div><div class="stack"><span class="badge">En sesión demo</span><h2>${samples[session].name}</h2><p class="muted">Variante y condición sin evaluar</p><p class="caption">La maqueta no asigna NM ni una variante por su cuenta.</p></div></div><label class="stack">Colección de destino<select id="destination"><option>Mi vitrina de muestra</option></select></label>${btn('Guardar muestra','save-scan',true)}<p class="caption">Sólo memoria local de esta página. No escribe en la API.</p></section><aside>${valuePanel()}</aside></div></div>`}
function trade(){return `<div class="stack-lg">${title('Modo encuentro · Propuesta','Tu mesa, tus reglas.','Separá lo que ofrecés de lo que buscás. Sin participantes ni propuestas reales.',btn('Vista compartida','share',true))}<div class="trade-pair"><section class="trade-side stack"><div class="between"><span class="arrow-disc">${icon('swap')}</span><span class="badge">Ofrezco · Demo</span></div><h2>Lo que puede cambiar</h2><p class="muted">Seleccioná desde la ficha. Cada carta requiere una decisión explícita.</p>${offered.length?`<div class="cards">${offered.map(tile).join('')}</div>`:'<p>No elegiste cartas para ofrecer en esta maqueta.</p>'}${btn('Elegir cartas','collection')}</section><section class="trade-side stack"><div class="between"><span class="arrow-disc">${icon('target')}</span><span class="badge proposal">Busco · Demo</span></div><h2>Tu próximo hallazgo</h2><p class="muted">Tus deseadas dan contexto a la conversación, sin publicar todo el inventario.</p>${wanted.length?`<div class="cards">${wanted.map(tile).join('')}</div>`:'<p>No elegiste deseadas en esta maqueta.</p>'}${btn('Explorar deseadas','goals')}</section></div><div class="compare-note"><b>Valor orientativo, no equivalencia garantizada.</b><p>No hay cotizaciones en este prototipo. Condición, variante y mercado pueden cambiar lo que cada persona acepta.</p></div></div>`}
function goals(){return `<div class="stack-lg">${title('Objetivos · Propuesta','Dale rumbo al álbum.','Elegí una intención, no una lista interminable de tareas.',btn('Ver colección','collection'))}<div class="three">${[['Un Pokémon favorito','Reuní cartas de un personaje que te guste.'],['Una expansión','Encontrá faltantes sin perder de vista lo que ya tenés.'],['Un ilustrador','Descubrí las cartas a través de quienes las dibujan.']].map(([t,d])=>`<section class="panel stack"><span class="badge proposal">Concepto</span><h2>${t}</h2><p class="muted">${d}</p>${btn('Explorar catálogo','search')}</section>`).join('')}</div><section class="stack"><h2>Para tu lista de deseadas</h2><p class="muted">Abrí una ficha y marcá una muestra. No se crean objetivos reales.</p><div class="cards">${[4,5,0,3].map(tile).join('')}</div></section></div>`}
function share(){return `<div class="stack-lg">${title('Vista compartida · Propuesta','Mostrá sólo lo elegido.','Esta vista previa no publica un enlace ni expone datos de tu cuenta.',btn('Volver','collection'))}<div class="two"><section class="preview-public stack-lg"><div class="stack"><span class="eyebrow">PokéScan / Vitrina de muestra</span><h2 class="public-title">Cartas para conversar.</h2><p class="muted">Selección editorial disponible en esta maqueta.</p></div><div class="cards">${(offered.length?offered:[]).map(tile).join('')}</div>${offered.length?'':'<p>No hay cartas seleccionadas para esta vista.</p>'}<div id="shared-value" hidden class="value-note">Valor no disponible · No hay precios conectados.</div><p class="caption">Sin inventario completo, datos personales ni valor total de la cuenta.</p></section><aside class="panel stack"><span class="badge proposal">Privacidad por elección</span><h2>Antes de compartir</h2><label class="check-row"><input id="show-values" type="checkbox">Mostrar referencia de valor</label><p class="caption">Sólo afecta esta vista previa. No cambia permisos reales.</p>${btn('Revisar selección','trade')}<div class="value-note">Publicación desactivada en el prototipo. No se genera un enlace público.</div></aside></div></div>`}
function searchView(){return `<div class="stack-lg">${title('Catálogo de muestra','Buscá tu próximo hallazgo.','Selección editorial acotada. No consulta el catálogo real.',btn('Escanear carta','scan',true))}<div class="search-layout"><aside class="panel search-aside stack"><span class="eyebrow">Explorar con intención</span><h2>Más que un nombre</h2><p class="caption">En el producto: expansión, número, rareza e ilustrador.</p>${btn('Ver objetivos','goals')}</aside><div class="stack-lg"><label class="search-field">Buscar por nombre<input id="search-input" type="search" placeholder="Probá con Pikachu" autocomplete="off"></label><p class="caption">Sólo filtra las seis ilustraciones de esta maqueta.</p><div id="search-results" class="cards wide-grid">${samples.map((_,i)=>tile(i)).join('')}</div></div></div></div>`}
function settings(){return `<div class="stack-lg">${title('Preferencias de maqueta','Tu espacio personal.','Ninguna preferencia se guarda en tu cuenta.',btn('Volver','home'))}<section class="panel stack"><h2>Apariencia</h2><p class="muted">La misma identidad en claro y oscuro.</p>${btn(theme?'Usar claro':'Usar oscuro','theme')}<div class="separator"></div><h2>Estado de esta muestra</h2><p class="muted">Podés reiniciar lo guardado, las deseadas y la mesa. Sólo se modifica la memoria del prototipo.</p>${btn('Reiniciar muestra','reset-demo')}</section></div>`}
const views={home,collection,detail,scan,trade,goals,share,search:searchView,settings};
function render(focus=false){document.getElementById('content').innerHTML=views[view]()+note();document.querySelectorAll('[data-nav]').forEach(el=>{if(el.dataset.nav===view||el.dataset.nav==='collection'&&['detail','goals','share','trade'].includes(view))el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});if(focus){window.scrollTo(0,0);document.getElementById('page-title')?.focus({preventScroll:true})}}
function go(next){view=next;render(true)}
function announce(message){document.getElementById('notice').textContent=message}
function toggle(list,id){const n=list.indexOf(id);if(n>=0)list.splice(n,1);else list.push(id)}
document.addEventListener('click',event=>{const control=event.target.closest('button');if(!control)return;if(control.dataset.nav){go(control.dataset.nav);return}if(control.hasAttribute('data-detail')){current=Number(control.dataset.detail);go('detail');return}if(control.dataset.filter){filter=control.dataset.filter;render();document.querySelector(`[data-filter="${filter}"]`)?.focus();return}const a=control.dataset.action;if(!a)return;if(['home','collection','scan','trade','share','goals','search','settings'].includes(a)){go(a);return}if(a==='theme'){theme=!theme;document.documentElement.classList.toggle('dark',theme);document.querySelectorAll('[data-theme-label]').forEach(el=>el.textContent=theme?'Tema claro':'Tema oscuro');if(view==='settings')render();return}if(a==='sample'){current=0;stage='review';render(true);return}if(a==='reset-scan'){session=null;stage='idle';render(true);return}if(a==='confirm'){session=current;stage='organize';render(true);announce('Muestra confirmada en sesión. Todavía no se guardó.');return}if(a==='save-scan'||a==='save-detail'){const id=a==='save-scan'?session:current;if(!saved.includes(id))saved.push(id);session=null;stage='idle';filter='saved';go('collection');announce('Muestra guardada sólo en este prototipo. No se modificó tu cuenta.');return}if(a==='toggle-offer'){toggle(offered,current);render();document.querySelector('[data-action="toggle-offer"]')?.focus();announce(offered.includes(current)?'Muestra añadida a tu mesa demo.':'Muestra retirada de tu mesa demo.');return}if(a==='toggle-wanted'){toggle(wanted,current);render();document.querySelector('[data-action="toggle-wanted"]')?.focus();announce(wanted.includes(current)?'Muestra marcada como deseada.':'Muestra retirada de deseadas.');return}if(a==='reset-demo'){saved=[];offered=[1];wanted=[4];session=null;stage='idle';filter='all';go('home');announce('Se reinició la muestra. Tu cuenta no se modificó.')}});
document.addEventListener('change',event=>{if(event.target.id==='candidate'){current=Number(event.target.value);render();document.getElementById('candidate').focus()}if(event.target.id==='show-values')document.getElementById('shared-value').hidden=!event.target.checked});
document.addEventListener('input',event=>{if(event.target.id!=='search-input')return;const q=event.target.value.trim().toLocaleLowerCase('es');const ids=samples.flatMap((c,i)=>c.name.toLocaleLowerCase('es').includes(q)?[i]:[]);document.getElementById('search-results').innerHTML=ids.length?ids.map(tile).join(''):'<section class="panel stack"><h2>Sin coincidencias</h2><p class="muted">No hay muestras con ese nombre. Borrá el texto para volver a verlas.</p></section>'});
render();
</script></body></html>
